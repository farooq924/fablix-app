<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Fablix ERP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f4661a">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fablix">
  <style>
    html,body{margin:0;height:100%;background:#f4661a;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #app{border:0;width:100%;height:100%;display:block}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f4661a;color:#fff;transition:opacity .4s;z-index:2}
    #splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    #splash b{margin-top:16px;font-size:20px;font-weight:800;letter-spacing:.3px}
    #splash span{margin-top:4px;font-size:13px;opacity:.9}
    .spin{margin-top:22px;width:26px;height:26px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    #offline{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#1f2a37;z-index:3;padding:24px;text-align:center}
    #offline b{font-size:18px} #offline p{color:#6b7280;font-size:14px;max-width:320px}
    #offline button{margin-top:14px;background:#f4661a;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
  </style>
</head>
<body>
  <div id="splash"><img src="icon-192.png" alt="Fablix"><b>Fablix ERP</b><span>Loading…</span><div class="spin"></div></div>
  <div id="offline">
    <b>No Internet</b>
    <p>Fablix ERP ko chalane ke liye internet connection zaroori hai (data Google Sheets par hai).</p>
    <button onclick="location.reload()">Retry</button>
  </div>
  <iframe id="app" title="Fablix ERP"></iframe>

  <script>
    /* ================= SETTINGS =================
       Neeche apne deployed Apps Script Web App ka /exec URL paste karein. */
    var APP_URL = "https://script.google.com/macros/s/AKfycbxCzM9IWyFyVV_2ITRFclY4pIcyW0wPRZQLaZBcyTyw_bF5SxvBF5Z2CXVpqpZG1ZFf0w/exec";
    /* ============================================ */

    var app = document.getElementById('app');
    var splash = document.getElementById('splash');
    var offlineEl = document.getElementById('offline');

    function showOffline(){ offlineEl.style.display = navigator.onLine ? 'none' : 'flex'; }
    window.addEventListener('online', showOffline);
    window.addEventListener('offline', showOffline);

    if (navigator.onLine) {
      app.src = APP_URL;
      app.addEventListener('load', function(){ splash.style.opacity = '0'; setTimeout(function(){ splash.style.display='none'; }, 450); });
      // Safety: agar load event miss ho jaye to bhi splash hata do
      setTimeout(function(){ splash.style.opacity='0'; setTimeout(function(){ splash.style.display='none'; },450); }, 6000);
    } else {
      splash.style.display = 'none';
      showOffline();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  </script>
</body>
</html>
